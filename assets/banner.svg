<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Felix Savedra — Shipping &amp; Receiving at Neuralink. Vedra Research - simulation and analytics for complex systems" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <filter id="fogGlow" x="-50%" y="-250%" width="200%" height="600%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="#0A0A0B"/>

  <g transform="translate(192,0)">
    <g opacity="1">
      <set attributeName="opacity" to="0" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1"
               calcMode="spline" keySplines="0.42 0 0.58 1"
               begin="t4.end+0.55s" dur="1.8s" fill="freeze"/>
      <text x="80" y="150" font-size="59" fill="#4A4A52" stroke="#4A4A52" stroke-width="2"
            filter="url(#fogGlow)" opacity="0.4">Felix Savedra</text>
      <text x="82" y="196" font-size="18" letter-spacing="0.6" fill="#4A4A52" stroke="#4A4A52" stroke-width="1.5"
            filter="url(#fogGlow)" opacity="0.3">Shipping &amp; Receiving at Neuralink</text>
      <text x="82" y="252" font-size="18" letter-spacing="0.6" fill="#4A4A52" stroke="#4A4A52" stroke-width="1.5"
            filter="url(#fogGlow)" opacity="0.3">Vedra Research - simulation &amp; analytics for complex systems</text>
    </g>

    <text x="80" y="150" fill="#E8E3D6"
          font-size="59">Felix Savedra</text>
    <text x="82" y="196" fill="#8C8C93"
          font-size="18" letter-spacing="0.6">Shipping &amp; Receiving at Neuralink</text>

    <rect x="80" y="98" height="70" width="0" fill="#0A0A0B">
      <set attributeName="x" to="80" begin="0s" fill="freeze"/>
      <set attributeName="width" to="524" begin="0s" fill="freeze"/>
      <animate attributeName="x" calcMode="discrete"
               values="80;117;153;190;226;264;300;337;373;410;446;483;519;556"
               begin="0.6s" dur="1.3s" fill="freeze"/>
      <animate id="t1" attributeName="width" calcMode="discrete"
               values="524;487;451;414;378;341;305;268;232;194;158;121;85;0"
               begin="0.6s" dur="1.3s" fill="freeze"/>
    </rect>
    <rect x="82" y="179" height="24" width="0" fill="#0A0A0B">
      <set attributeName="x" to="82" begin="0s" fill="freeze"/>
      <set attributeName="width" to="437" begin="0s" fill="freeze"/>
      <animate attributeName="x" calcMode="discrete"
               values="82;106;129;153;177;200;224;248;270;294;317;341;365;388;412;436;459;471"
               begin="t1.end" dur="1.4s" fill="freeze"/>
      <animate id="t2" attributeName="width" calcMode="discrete"
               values="437;413;390;366;342;319;295;271;248;224;202;178;154;131;107;83;60;0"
               begin="t1.end" dur="1.4s" fill="freeze"/>
    </rect>

    <rect y="99" width="3" height="55" x="80" fill="#B23A3A" opacity="0">
      <animate attributeName="x" calcMode="discrete"
               values="80;117;153;190;226;264;300;337;373;410;446;483;519;556"
               begin="0.6s" dur="1.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite" begin="0.6s" end="t1.end"/>
      <set attributeName="opacity" to="0" begin="t1.end" fill="freeze"/>
    </rect>
    <rect y="181" width="2" height="19" x="82" fill="#B23A3A" opacity="0">
      <animate attributeName="x" calcMode="discrete"
               values="82;106;129;153;177;200;224;248;270;294;317;341;365;388;412;436;459;471"
               begin="t1.end" dur="1.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite" begin="t1.end" end="t2.end"/>
      <set attributeName="opacity" to="0" begin="t2.end" fill="freeze"/>
    </rect>

    <g opacity="0">
      <set attributeName="opacity" to="0" begin="0s" fill="freeze"/>
      <animate id="t3" attributeName="opacity" from="0" to="1" begin="t2.end" dur="0.6s" fill="freeze"/>
      <line x1="82" y1="222" x2="640" y2="222" stroke="#B23A3A" stroke-width="2"/>
    </g>

    <text x="82" y="252" fill="#C6A15B" opacity="0.9"
          font-size="18" letter-spacing="0.6">Vedra Research - simulation &amp; analytics for complex systems</text>

    <rect x="82" y="235" height="24" width="0" fill="#0A0A0B">
      <set attributeName="x" to="82" begin="0s" fill="freeze"/>
      <set attributeName="width" to="734" begin="0s" fill="freeze"/>
      <animate attributeName="x" calcMode="discrete"
               values="82;105;126;149;172;194;216;239;261;284;306;328;351;374;395;418;441;462;485;508;530;552;575;597;620;642;664;687;710;731;754;768"
               begin="t3.end" dur="2.5s" fill="freeze"/>
      <animate id="t4" attributeName="width" calcMode="discrete"
               values="734;712;690;667;644;623;600;577;556;533;510;488;466;443;421;398;376;354;331;308;287;264;241;220;197;174;152;130;107;85;62;0"
               begin="t3.end" dur="2.5s" fill="freeze"/>
    </rect>
    <rect y="237" width="2" height="19" x="82" fill="#B23A3A" opacity="0">
      <animate attributeName="x" calcMode="discrete"
               values="82;105;126;149;172;194;216;239;261;284;306;328;351;374;395;418;441;462;485;508;530;552;575;597;620;642;664;687;710;731;754"
               begin="t3.end" dur="2.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite" begin="t3.end" end="t4.end"/>
      <set attributeName="opacity" to="0" begin="t4.end" fill="freeze"/>
    </rect>
</g>
</svg>
