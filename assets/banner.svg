      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.6s" fill="freeze"/>
      <line x1="361" y1="222" x2="919" y2="222" stroke="#B23A3A" stroke-width="2"/>
    </g>

    <text x="640" y="252" text-anchor="middle" fill="#C6A15B" opacity="0.9"
