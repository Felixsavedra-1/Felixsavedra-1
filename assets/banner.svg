<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Felix Savedra — Shipping &amp; Receiving at Neuralink. Founder at Vedra Research" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <filter id="fogGlow" x="-50%" y="-250%" width="200%" height="600%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="#0A0A0B"/>

  <g>
    <g opacity="1">
      <set attributeName="opacity" to="0" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1"
               calcMode="spline" keySplines="0.42 0 0.58 1"
               begin="5.51s" dur="1.8s" fill="freeze"/>
      <text x="640" y="150" text-anchor="middle" font-size="59" fill="#4A4A52" stroke="#4A4A52" stroke-width="2"
            filter="url(#fogGlow)" opacity="0.4">Felix Savedra</text>
      <text x="640" y="196" text-anchor="middle" font-size="18" letter-spacing="0.6" fill="#4A4A52" stroke="#4A4A52" stroke-width="1.5"
            filter="url(#fogGlow)" opacity="0.3">Shipping &amp; Receiving at Neuralink</text>
      <text x="640" y="252" text-anchor="middle" font-size="18" letter-spacing="0.6" fill="#4A4A52" stroke="#4A4A52" stroke-width="1.5"
            filter="url(#fogGlow)" opacity="0.3">Founder at Vedra Research</text>
    </g>

    <text x="640" y="150" text-anchor="middle" fill="#E8E3D6"
