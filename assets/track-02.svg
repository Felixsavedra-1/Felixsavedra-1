<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 26" width="330" height="26" role="img" aria-label="Pyro — Kings of Leon" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="330" height="26" fill="#0A0A0B"/>
  <g opacity="1">
    <set attributeName="opacity" to="0" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" calcMode="discrete"
             values="0;1;0;1;0;0.55;1" keyTimes="0;0.08;0.2;0.34;0.5;0.66;1"
             begin="0.55s" dur="0.55s" fill="freeze"/>
    <text x="8" y="17.5" font-size="13"><tspan fill="#E8E3D6">Pyro</tspan><tspan fill="#8C8C93">  —  Kings of Leon</tspan></text>
  </g>
</svg>
