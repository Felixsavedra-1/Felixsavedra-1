<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 64" width="1280" height="64" role="img" aria-label="Weird Fishes / Arpeggi — Radiohead" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <filter id="fogGlow" x="-50%" y="-250%" width="200%" height="600%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="64" fill="#0A0A0B"/>

  <g opacity="1">
    <set attributeName="opacity" to="0" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" calcMode="discrete"
             values="0;1;0;1;0;0.55;1" keyTimes="0;0.08;0.2;0.34;0.5;0.66;1"
             begin="0.8s" dur="0.55s" fill="freeze"/>

    <g opacity="1">
      <set attributeName="opacity" to="0" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1"
               calcMode="spline" keySplines="0.42 0 0.58 1"
               begin="1.9s" dur="1.8s" fill="freeze"/>
      <text x="140" y="42" font-size="28" fill="#4A4A52" stroke="#4A4A52" stroke-width="1.5" filter="url(#fogGlow)" opacity="0.75">Weird Fishes / Arpeggi</text>
    </g>

    <text x="80" y="42" font-size="18" letter-spacing="0.6" fill="#8C8C93" opacity="0.75">03</text>
    <text x="140" y="42" font-size="28"><tspan fill="#E8E3D6">Weird Fishes / Arpeggi</tspan><tspan fill="#8C8C93">  —  Radiohead</tspan></text>

    <g fill="#B23A3A" opacity="0.9">
      <rect x="1080" y="34" width="6" height="12">
        <animate attributeName="height" values="12;24;10;26;12" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="34;22;36;20;34" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="1094" y="26" width="6" height="20">
        <animate attributeName="height" values="20;8;24;14;20" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;38;22;32;26" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="1108" y="32" width="6" height="14">
        <animate attributeName="height" values="14;26;10;22;14" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="32;20;36;24;32" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="1122" y="22" width="6" height="24">
        <animate attributeName="height" values="24;12;26;8;24" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;34;20;38;22" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="1136" y="36" width="6" height="10">
        <animate attributeName="height" values="10;20;14;24;10" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="36;26;32;22;36" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M1176 22 L1176 46 L1198 34 Z" fill="#B23A3A" opacity="0.9"/>
  </g>
</svg>
